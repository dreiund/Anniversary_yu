name: Anniversary
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    CURRENT_PROJECT_VERSION: 9
    MARKETING_VERSION: 0.6.1
    DEVELOPMENT_TEAM: N4YSFLZ44L
    CODE_SIGN_STYLE: Automatic
targets:
  Anniversary:
    type: application
    platform: iOS
    sources:
      - App
      - Features
      - DesignSystem
      - Domain
      - Persistence
      - Support
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Anniversary
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: 用于给记忆自动记录当前位置
        LSApplicationQueriesSchemes: [iosamap]
        CKSharingSupported: true
        UIBackgroundModes: [remote-notification]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/Anniversary.entitlements
      properties:
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.fkc.anniversary]
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fkc.anniversary
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - AnniversaryTests
        - AnniversaryUITests
      commandLineArguments:
        "-InitCloudKitSchema": false
  AnniversaryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Anniversary
  AnniversaryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Anniversary
